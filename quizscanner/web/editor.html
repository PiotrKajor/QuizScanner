<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizScanner — Edytor</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/themes.css">
  <link rel="stylesheet" href="/static/common.css">
  <link rel="stylesheet" href="/static/editor.css">
</head>
<body class="editor">
  <div class="ed-top">
    <span class="brand"><img class="brand-logo" src="/static/logo.svg" alt="">QuizScanner</span>
    <div class="tabs">
      <button class="tab active" id="tabQuiz" data-i18n="e_tab_quiz"></button>
      <button class="tab" id="tabRoster" data-i18n="e_tab_roster"></button>
    </div>
    <div class="spacer"></div>
    <select id="themeSel" class="lang-sel" data-i18n-title="theme_label"></select>
    <select id="langSel" class="lang-sel">
      <option value="pl">🇵🇱 Polski</option>
      <option value="en">🇬🇧 English</option>
    </select>
    <button class="btn-ghost" id="toTeacher" data-i18n="e_to_teacher"></button>
  </div>

  <!-- ZAKŁADKA: QUIZY -->
  <div class="ed-body" id="quizView">
    <div class="side">
      <h3 data-i18n="e_quizzes"></h3>
      <ul class="qlist" id="quizList"></ul>
      <button class="btn-primary" id="newQuiz" style="width:100%" data-i18n="e_new_quiz"></button>
      <hr>
      <button class="btn-ghost" id="importBtn" style="width:100%" data-i18n="e_import_file"></button>
      <input type="file" id="importFile" accept=".quiz,.json,application/json" hidden>
      <p class="muted" data-i18n="e_file_hint"></p>
      <hr>
      <button class="btn-ghost" id="wordBtn" style="width:100%" data-i18n="wi_button"></button>
      <input type="file" id="wordFile" accept=".docx,.txt,text/plain" hidden>
      <p class="muted"><span data-i18n="wi_hint"></span>
        <a href="/api/quiz/template.docx" class="ed-link" data-i18n="wi_template"></a></p>
    </div>

    <div class="main">
      <div class="panel">
        <label class="field" data-i18n="e_quiz_title"></label>
        <input class="text" id="quizTitle" data-i18n-ph="e_quiz_title_ph">
        <div class="meta-row" style="margin-top:12px">
          <button class="btn-ok" id="saveQuiz" data-i18n="e_save"></button>
          <button class="btn-ghost" id="dupQuiz" data-i18n="e_duplicate"></button>
          <button class="btn-ghost" id="exportQuiz" data-i18n="e_export_file"></button>
          <button class="btn-danger" id="delQuiz" data-i18n="e_delete"></button>
          <span class="muted" id="editingName" style="align-self:center"></span>
        </div>
      </div>

      <!-- Ustawienia quizu -->
      <div class="panel">
        <h3 class="panel-h" data-i18n="s_quiz_settings"></h3>
        <div class="set-grid">
          <div><label class="field" data-i18n="s_default_time"></label>
            <input class="text" type="number" min="0" id="setTime"></div>
          <div><label class="field" data-i18n="s_default_points"></label>
            <input class="text" type="number" min="0" step="100" id="setPoints"></div>
          <div><label class="field" data-i18n="s_auto_reveal_s"></label>
            <input class="text" type="number" min="0" id="setReveal"></div>
          <div><label class="field" data-i18n="s_auto_gap_s"></label>
            <input class="text" type="number" min="0" id="setGap"></div>
        </div>
        <div class="set-checks">
          <label class="chk"><input type="checkbox" id="setShuffleQ"><span data-i18n="s_shuffle_q"></span></label>
          <label class="chk"><input type="checkbox" id="setShuffleA"><span data-i18n="s_shuffle_a"></span></label>
          <label class="chk"><input type="checkbox" id="setShowDist"><span data-i18n="s_show_dist"></span></label>
        </div>
        <button class="btn-ghost" id="applyAll" style="margin-top:12px" data-i18n="s_apply_all"></button>
      </div>

      <!-- Przybornik matematyczny: wstawia symbole do ostatnio klikniętego pola -->
      <div class="panel mathbar" id="mathPanel">
        <div class="panel-head">
          <h3 class="panel-h" data-i18n="mb_title"></h3>
          <button class="btn-ghost mb-toggle" id="mathToggle" data-i18n="mb_hide"></button>
        </div>
        <div id="mathBox"></div>
      </div>

      <div class="panel import-warn hidden" id="importWarn"></div>

      <div id="questions"></div>
      <button class="add-q" id="addQ" data-i18n="e_add_question"></button>
    </div>
  </div>

  <!-- ZAKŁADKA: UCZNIOWIE -->
  <div class="ed-body hidden" id="rosterView">
    <div class="side">
      <h3 data-i18n="cl_classes"></h3>
      <ul class="qlist" id="classList"></ul>
      <button class="btn-primary" id="newClass" style="width:100%" data-i18n="cl_new"></button>
      <hr>
      <label class="field" data-i18n="cl_name"></label>
      <input class="text" id="className">
      <p class="muted" data-i18n="e_roster_hint"></p>
      <button class="btn-ok" id="saveRoster" style="width:100%" data-i18n="e_save_roster"></button>
      <button class="btn-ghost" id="addStudent" style="width:100%; margin-top:8px" data-i18n="e_add_student"></button>
      <button class="btn-danger" id="delClass" style="width:100%; margin-top:8px" data-i18n="cl_delete"></button>
      <hr>
      <button class="btn-ghost" id="rosterImportBtn" style="width:100%" data-i18n="ri_button"></button>
      <input type="file" id="rosterFile" accept=".csv,.txt,.xlsx,text/csv,text/plain" hidden>
      <p class="muted" data-i18n="ri_hint"></p>
      <button class="btn-ghost" id="rosterExport" style="width:100%" data-i18n="ri_export"></button>
      <hr>
      <button class="btn-primary" id="cardsBtn" style="width:100%" data-i18n="e_cards_pdf"></button>
      <p class="muted" data-i18n="e_cards_hint"></p>
    </div>
    <div class="main">
      <div class="panel import-warn hidden" id="rosterWarn"></div>
      <div class="panel">
        <table class="roster-table">
          <thead><tr>
            <th style="width:90px" data-i18n="e_col_id"></th>
            <th data-i18n="e_col_name"></th><th style="width:60px"></th>
          </tr></thead>
          <tbody id="rosterBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <input type="file" id="mediaFile" accept="image/*,video/mp4,video/webm" hidden>
  <div class="toast" id="toast"></div>
  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/tex.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/mathbar.js"></script>
  <script src="/static/editor.js"></script>
</body>
</html>
